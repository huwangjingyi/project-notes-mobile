<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfcfa" />
    <meta name="description" content="手动收集微信群项目，快速解析并跟进。" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/radar.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/radar.svg" />
    <link rel="stylesheet" href="styles.css" />
    <title>项目速记</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">DESIGN PROJECT RADAR</p>
          <h1>项目速记</h1>
        </div>
        <button class="icon-button" id="settingsButton" type="button" aria-label="打开设置" title="设置">
          <span aria-hidden="true">•••</span>
        </button>
      </header>

      <section class="summary" aria-label="今日概览">
        <div class="summary-heading">
          <p>今日优先</p>
          <time id="todayLabel"></time>
        </div>
        <strong id="priorityCount">0</strong>
        <span>个项目值得跟进</span>
        <div class="summary-rule"></div>
        <p class="summary-copy" id="summaryCopy">把群里的项目转发或粘贴到这里，线索只保存在这台设备。</p>
      </section>

      <nav class="tabs" aria-label="项目视图">
        <button class="tab is-active" data-view="today" type="button">今日</button>
        <button class="tab" data-view="pipeline" type="button">项目</button>
        <button class="tab" data-view="capture" type="button">收集</button>
      </nav>

      <section class="view" id="todayView">
        <div class="section-heading">
          <h2>需要处理</h2>
          <span id="todayCount"></span>
        </div>
        <div class="project-list" id="todayList"></div>
        <div class="empty-state" id="todayEmpty">
          <p class="empty-kicker">暂时没有待办</p>
          <p>收集一条群消息，判断是否值得接，再把它放进跟进列表。</p>
          <button class="primary-button" data-go-capture type="button">收集项目</button>
        </div>
      </section>

      <section class="view is-hidden" id="pipelineView">
        <div class="filter-row" role="group" aria-label="项目筛选">
          <button class="filter-chip is-selected" data-filter="open" type="button">进行中</button>
          <button class="filter-chip" data-filter="all" type="button">全部</button>
          <button class="filter-chip" data-filter="saved" type="button">待判断</button>
          <button class="filter-chip" data-filter="done" type="button">已完成</button>
        </div>
        <div class="project-list" id="pipelineList"></div>
        <div class="empty-state" id="pipelineEmpty">
          <p class="empty-kicker">还没有项目</p>
          <p>从微信群主动分享一条项目消息到这里开始。</p>
        </div>
      </section>

      <section class="view is-hidden capture-view" id="captureView">
        <div class="capture-intro">
          <p class="eyebrow">主动收集</p>
          <h2>粘贴一条项目消息</h2>
          <p>可直接粘贴群消息、招聘帖或项目 brief。保存前会先给出提取结果。</p>
        </div>
        <form id="captureForm">
          <label class="field">
            <span>项目原文</span>
            <textarea id="sourceText" name="sourceText" rows="8" placeholder="例如：急找 UI 设计师，做 6 页小程序页面，预算 5000-8000，本周五前给初稿。联系微信：brand_xx"></textarea>
          </label>
          <div class="form-grid">
            <label class="field">
              <span>来源群 / 备注</span>
              <input id="sourceGroup" name="sourceGroup" placeholder="例如：设计接单群" />
            </label>
            <label class="field">
              <span>收到日期</span>
              <input id="capturedAt" name="capturedAt" type="date" />
            </label>
          </div>
          <button class="secondary-button" id="parseButton" type="button">解析内容</button>
          <section class="parsed-card is-hidden" id="parsedCard" aria-live="polite">
            <div class="parsed-card-heading">
              <h3>识别结果</h3>
              <span>可直接修改</span>
            </div>
            <label class="field">
              <span>项目名称</span>
              <input id="projectTitle" name="projectTitle" />
            </label>
            <div class="form-grid">
              <label class="field">
                <span>预算</span>
                <input id="budget" name="budget" placeholder="未提及" />
              </label>
              <label class="field">
                <span>截止时间</span>
                <input id="deadline" name="deadline" type="date" />
              </label>
            </div>
            <label class="field">
              <span>交付物</span>
              <input id="deliverables" name="deliverables" placeholder="未提及" />
            </label>
            <label class="field">
              <span>联系人</span>
              <input id="contact" name="contact" placeholder="未提及" />
            </label>
            <label class="field">
              <span>你的判断</span>
              <select id="projectStatus" name="projectStatus">
                <option value="saved">先保存，之后判断</option>
                <option value="followup">值得联系</option>
                <option value="paused">暂不跟进</option>
              </select>
            </label>
            <button class="primary-button" type="submit">保存到项目列表</button>
          </section>
        </form>
      </section>
    </main>

    <dialog id="projectDialog" class="project-dialog">
      <div id="dialogContent"></div>
    </dialog>

    <dialog id="settingsDialog" class="settings-dialog">
      <form method="dialog">
        <div class="dialog-header">
          <div><p class="eyebrow">本机数据</p><h2>设置</h2></div>
          <button class="icon-button" value="close" aria-label="关闭设置" title="关闭">×</button>
        </div>
        <p>项目只保存在当前浏览器。定时提醒需要在部署支持 Web Push 的服务后启用。</p>
        <button class="outline-button" id="exportButton" type="button">导出项目数据</button>
        <button class="danger-button" id="clearButton" type="button">清空本机项目</button>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status"></div>
    <script src="app.js?v=2"></script>
  </body>
</html>
